services:
  backend:
    build:
      context: ./后端
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-9000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-./data/logs}
      DB_PATH: ${DB_PATH:-./data/robot-cloud.db}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-100}
      WS_ROBOT_PATH: ${WS_ROBOT_PATH:-/api/v1/robot}
      WS_PHONE_PATH: ${WS_PHONE_PATH:-/api/v1/phone}
      WS_WEB_PATH: ${WS_WEB_PATH:-/api/v1/web}
      FORCE_CONSOLE_LOGS: "1"
    volumes:
      - ./后端/data:/app/data
    expose:
      - "${BACKEND_PORT:-9000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + '/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./前端
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      BACKEND_UPSTREAM: backend:${BACKEND_PORT:-9000}
      FRONTEND_UPSTREAM: frontend:80
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
